<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b100f"><title>ПарГид — бани и сауны Калининграда</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>

:grid;place-items:center}.top,.cards,.nav,.screen,.back,.modal,.toast{position:absolute}}
</style></head><body><main id="app"><div id="map"></div><header class="top" id="mapTop"><div class="bar"><div class="logo">♨</div><div><b>ПарГид</b><small>Калининград · каталог 15.08.2026</small></div></div><div class="search"><input id="q" placeholder="Название, адрес, бассейн, хаммам…"></div><div class="chips" id="chips"></div></header><div class="cards" id="cards"></div><section class="screen" id="catalog"><div class="head"><h1>Каталог</h1><span class="badge" id="count"></span></div><div class="list" id="list"></div></section><section class="screen" id="requests"><div class="head"><h1>Мои заявки</h1></div><div id="reqs"></div></section><nav class="nav"><button class="on" data-s="map">⌖ Карта</button><button data-s="catalog">☷ Каталог</button><button data-s="requests">◷ Заявки</button></nav><div class="back" id="detail"><div class="sheet" id="sheet"></div></div><div class="modal" id="bookModal"><div class="box"><h2>Запросить бронь</h2><div class="muted" id="bookName"></div><form class="form" id="bookForm"><div class="field"><label>Дата</label><input id="date" type="date" required></div><div class="field"><label>Время</label><input id="time" type="time" value="19:00" required></div><div class="field"><label>Часов</label><select id="hours"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Гостей</label><input id="guests" type="number" min="1" value="4" required></div><div class="field full"><label>Телефон</label><input id="phone" type="tel" placeholder="+7 900 000-00-00" required></div><div class="field full"><label>Комментарий</label><textarea id="comment" placeholder="Например: нужен бассейн"></textarea></div><button class="submit">Отправить запрос</button></form></div></div><div class="toast" id="toast"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="venues.js"></script><script src="photo-sources.js"></script><script src="swipe-fix-v6.js"></script><script>
const venues=window.VENUES||[],photoSources=window.PHOTO_SOURCES||{},filters=['Все','Бассейн','До 2500 ₽','Хаммам','На дровах','24/7','📷 Официальные фото'];let active='Все',chosen=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],markers={},favs=new Set(JSON.parse(localStorage.getItem('pargid_favs')||'[]')),bookings=JSON.parse(localStorage.getItem('pargid_bookings')||'[]');
const money=n=>n?Number(n).toLocaleString('ru-RU'):'',price=v=>v.price?`от ${money(v.price)}${v.priceMax?`–${money(v.priceMax)}`:''} ₽/час`:'Цена по запросу',rate=v=>v.rating?`★ ${v.rating}`:'',cap=v=>v.cap?`до ${v.cap}`:'уточнить',ps=v=>photoSources[v.name]||null;let map;if(window.L){map=L.map('map',{zoomControl:false}).setView([54.7104,20.4522],12.2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}else map={flyTo(){},invalidateSize(){}};
function icon(id){return L.divIcon({className:'',html:`<div style="width:40px;height:40px;border-radius:14px;background:${chosen===id?'#f2a93b':'#111815'};border:2px solid #f2a93b;display:grid;place-items:center;font-size:19px">♨</div>`,iconSize:[40,40],iconAnchor:[20,20]})}function addMarker(v){if(!window.L||!v.lat||!v.lng||markers[v.id])return;let m=L.marker([v.lat,v.lng],{icon:icon(v.id)}).addTo(map);m.on('click',()=>open(v.id));markers[v.id]=m}const gc=JSON.parse(localStorage.getItem('pargid_geo4')||'{}');venues.forEach(v=>{if(gc[v.address]){v.lat=gc[v.address][0];v.lng=gc[v.address][1];addMarker(v)}});async function geocode(){if(!window.L)return;for(const v of venues){if(v.lat)continue;try{let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q=${encodeURIComponent('Калининград, '+v.address)}`),a=await r.json();if(a[0]){v.lat=+a[0].lat;v.lng=+a[0].lon;gc[v.address]=[v.lat,v.lng];localStorage.setItem('pargid_geo4',JSON.stringify(gc));addMarker(v)}}catch(e){}await new Promise(r=>setTimeout(r,1100))}}setTimeout(geocode,500);
function data(){let q=$('#q').value.trim().toLowerCase();return venues.filter(v=>(!q||[v.name,v.type,v.address,...v.features].join(' ').toLowerCase().includes(q))&&(active==='Все'||active==='Бассейн'&&v.features.includes('Бассейн')||active==='До 2500 ₽'&&v.price&&v.price<=2500||active==='Хаммам'&&v.features.includes('Хаммам')||active==='На дровах'&&v.features.includes('На дровах')||active==='24/7'&&v.features.includes('24/7')||active==='📷 Официальные фото'&&!!ps(v)))}function officialBadge(v){return ps(v)?'<span class="photo-ok">📷 официальный источник</span>':''}function card(v){return `<div class="card" data-id="${v.id}"><img src="${v.img}" alt=""><div class="cb"><div class="ct"><b>${v.name}</b><span class="rate">${rate(v)}</span></div><div class="muted">${v.type}</div><div class="muted">${v.address}</div><div class="price">${price(v)}</div>${officialBadge(v)}</div></div>`}function item(v){return `<article class="item" data-id="${v.id}"><img src="${v.img}" alt=""><div class="ib"><div class="ct"><b>${v.name}</b><span class="rate">${rate(v)}</span></div><div class="muted">${v.type}</div><div class="muted">${v.address}</div><div class="price">${price(v)}</div>${officialBadge(v)}<div class="tags">${v.features.slice(0,3).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></article>`}function render(){let a=data();$('#chips').innerHTML=filters.map(x=>`<button class="chip ${x===active?'on':''}" data-f="${x}">${x}</button>`).join('');$('#cards').innerHTML=a.slice(0,30).map(card).join('');$('#list').innerHTML=a.map(item).join('');$('#count').textContent=`${a.length} из ${venues.length}`;$$('[data-f]').forEach(b=>b.onclick=()=>{active=b.dataset.f;render()});$$('[data-id]').forEach(e=>e.onclick=()=>open(+e.dataset.id));renderReqs()}
function open(id){let v=venues.find(x=>x.id===id),photo=ps(v);chosen=id;if(v.lat)map.flyTo([v.lat,v.lng],14);Object.entries(markers).forEach(([k,m])=>m.setIcon(icon(+k)));$('#sheet').innerHTML=`<div class="hero"><img src="${v.img}" alt=""><button class="fav">${favs.has(id)?'♥':'♡'}</button><button class="x">×</button></div><div class="detail"><h2>${v.name}</h2><div class="muted">${v.address}</div><div class="facts"><div class="fact"><b>${v.rating?'★ '+v.rating:'—'}</b><small>рейтинг</small></div><div class="fact"><b>${cap(v)}</b><small>гостей</small></div><div class="fact"><b>${v.price?money(v.price)+' ₽':'уточнить'}</b><small>от / час</small></div></div><div class="tags">${v.features.map(x=>`<span class="tag">${x}</span>`).join('')}</div><p style="line-height:1.5;color:#c8d0cc">${v.desc}</p><div class="muted">Источник данных: ${v.source} · сверено 15.08.2026</div>${photo?`<div class="official-box"><b>✓ Проверен официальный фото-источник</b><small>${photo.label}. Изображения не копируются в ПарГид — открывается страница владельца/оператора.</small></div>`:''}<div class="actions"><button class="secondary" id="call">☎ Позвонить</button><button class="primary" id="book">🔥 Запросить бронь</button><button class="route" id="route">⌖ Маршрут в Яндекс Картах</button>${photo?'<button class="photos" id="photos">📷 Смотреть официальные фото</button>':''}</div></div>`;$('#detail').classList.add('on');$('.x').onclick=()=>$('#detail').classList.remove('on');$('.fav').onclick=()=>{favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('pargid_favs',JSON.stringify([...favs]));$('.fav').textContent=favs.has(id)?'♥':'♡'};$('#call').onclick=()=>v.phone?location.href='tel:'+v.phone:toast('Телефон пока не подтверждён — отправьте запрос на бронь');$('#route').onclick=()=>window.open(`https://yandex.ru/maps/?text=${encodeURIComponent('Калининград, '+v.address)}`,'_blank');$('#book').onclick=()=>book(v);if(photo)$('#photos').onclick=()=>window.open(photo.url,'_blank','noopener')}
function book(v){chosen=v;$('#bookName').textContent=v.name+' · '+price(v);let d=new Date();d.setDate(d.getDate()+1);$('#date').value=d.toISOString().slice(0,10);$('#date').min=new Date().toISOString().slice(0,10);$('#bookModal').classList.add('on')}function renderReqs(){$('#reqs').innerHTML=bookings.length?bookings.slice().reverse().map(b=>`<div class="booking"><span class="status">Ожидает ответа</span><h3>${b.venue}</h3><div class="muted">${b.date} · ${b.time} · ${b.hours} ч. · ${b.guests} гостей</div></div>`).join(''):'<div style="padding:50px 10px;text-align:center;color:#a9b5af">Заявок пока нет</div>'}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.to);window.to=setTimeout(()=>e.classList.remove('on'),2500)}function screen(s){let isMap=s==='map';$('#catalog').classList.toggle('on',s==='catalog');$('#requests').classList.toggle('on',s==='requests');$('#map').style.display=isMap?'block':'none';$('#mapTop').style.display=isMap?'block':'none';$('#cards').classList.toggle('screen-hidden',!isMap);$('#cards').style.display=isMap?'flex':'none';$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));if(isMap)setTimeout(()=>map.invalidateSize(),50)}$$('.nav button').forEach(b=>b.onclick=()=>screen(b.dataset.s));$('#q').oninput=render;$('#detail').onclick=e=>{if(e.target.id==='detail')$('#detail').classList.remove('on')};$('#bookModal').onclick=e=>{if(e.target.id==='bookModal')$('#bookModal').classList.remove('on')};$('#bookForm').onsubmit=e=>{e.preventDefault();bookings.push({venue:chosen.name,date:$('#date').value,time:$('#time').value,hours:$('#hours').value,guests:$('#guests').value,phone:$('#phone').value,comment:$('#comment').value});localStorage.setItem('pargid_bookings',JSON.stringify(bookings));$('#bookModal').classList.remove('on');$('#detail').classList.remove('on');renderReqs();screen('requests');toast('Заявка сохранена в прототипе')};render();
</script></body></html>
