<style>

(88vw,390px);height:118px;background:#111815f7;border:1px solid #ffffff12;border-radius:22px;display:flex;overflow:hidden;box-shadow:var(--shadow);scroll-snap-align:center}.card img{width:120px;object-fit:cover}.cb{padding:11px;min-width:0;flex:1}.ct{display:flex;justify-content:space-between;gap:8px}.ct b{font-size:16px}.rate{color:var(--a2);font-size:13px}.muted{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:900;margin-top:10px}.price small{font-weight:500;color:var(--muted)}.nav{position:absolute;z-index:1000;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:62px;border:1px solid #ffffff12;border-radius:22px;background:#0d1311f7;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#8d9993;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.nav button span{font-size:19px}.nav button.on{color:var(--a2)}.screen{display:none;position:absolute;z-index:500;inset:0;background:var(--bg);padding:84px 14px 90px;overflow:auto}.screen.on{display:block}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.head h1{margin:0;font-size:27px}.badge{padding:7px 10px;border-radius:999px;background:#24312b;color:#c8d2cd;font-size:12px}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:112px 1fr;background:var(--p);border:1px solid var(--line);border-radius:21px;overflow:hidden}.item img{width:112px;height:132px;object-fit:cover}.item .body{padding:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{padding:5px 8px;border-radius:999px;background:#202c27;color:#d0d8d4;font-size:11px}.empty{text-align:center;color:var(--muted);padding:48px 15px}.empty strong{display:block;font-size:42px;margin-bottom:10px}.booking{background:var(--p);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:11px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#332b18;color:#ffd48d;font-size:12px}.booking h3{margin:10px 0 5px}.booking p{margin:4px 0;color:var(--muted);font-size:13px}.backdrop{display:none;position:absolute;z-index:1300;inset:0;background:#0009}.backdrop.on{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#0f1613;border-radius:28px 28px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom))}.hero{height:245px;position:relative}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#0f1613)}.close,.fav{position:absolute;z-index:2;top:14px;width:42px;height:42px;border:0;border-radius:14px;background:#09100dcc;color:white;font-size:20px}.close{right:14px}.fav{left:14px}.detail{position:relative;z-index:2;margin-top:-13px;padding:0 16px 16px}.detail h2{font-size:27px;margin:0 0 5px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.fact{text-align:center;padding:11px 5px;border-radius:15px;background:var(--p2)}.fact b{display:block}.fact small{color:var(--muted)}.section{margin:17px 0 8px;font-weight:900}.desc{font-size:14px;line-height:1.5;color:#c8d0cc}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.actions button{height:49px;border:0;border-radius:16px;font-weight:900}.call{background:#1e2924;color:white}.book{background:var(--a);color:#25180a}.route{grid-column:span 2;background:#24302b;color:white}.taxi{grid-column:span 2;background:#ffd900;color:#141414}.modal{display:none;position:absolute;z-index:1500;inset:0;background:#000a;align-items:flex-end}.modal.on{display:flex}.mbox{width:100%;max-height:92%;overflow:auto;background:var(--p);border-radius:28px 28px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom))}.grab{width:42px;height:4px;background:#405048;border-radius:99px;margin:0 auto 14px}.mbox h2{margin:0}.sub{color:var(--muted);font-size:13px;margin:5px 0 15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:span 2}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid #2c3933;background:#0d1311;color:white;border-radius:14px;padding:12px;outline:none}.field textarea{min-height:75px}.submit{grid-column:span 2;height:52px;border:0;border-radius:16px;background:var(--a);color:#25180a;font-weight:900}.toast{position:absolute;z-index:1900;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#f5f7f6;color:#111815;padding:11px 14px;border-radius:14px;box-shadow:var(--shadow);font-size:13px;pointer-events:none;text-align:center;max-width:88%}.toast.on{opacity:1;transform:translate(-50%,0)}.marker{width:42px;height:42px;border-radius:15px;background:#111815;border:2px solid var(--a);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 25px #0007}.desktop{display:none}@media(min-width:760px){body{display:grid;place-items:center}.app{width:430px;height:900px;max-height:96vh;border:1px solid #27352e;border-radius:36px;box-shadow:0 28px 100px #0009}.desktop{display:block;position:fixed;left:24px;top:24px;width:310px;color:#aeb9b4}.desktop h2{color:white}}
</style>
</head>
<body>
<div class="desktop"><h2>ПарГид · прототип</h2><p>Кликабельный мобильный интерфейс сервиса поиска бань и саун.</p></div>
<div class="app">
<div id="map"></div>
<header class="top" id="mapTop"><div class="row"><div class="brand"><div class="logo">♨</div><div><b>ПарГид</b><small>Калининград</small></div></div><div class="spacer"></div><button class="icon" id="profile">☺</button></div><div class="search"><label class="searchbox">⌕&nbsp;<input id="search" placeholder="Баня, бассейн, хаммам…"></label></div><div class="chips" id="chips"></div></header>
<div class="cards" id="cards"></div>
<section class="screen" id="catalog"><div class="head"><h1>Все места</h1><span class="badge" id="count"></span></div><div class="list" id="catalogList"></div></section>
<section class="screen" id="requests"><div class="head"><h1>Мои заявки</h1></div><div id="requestList"></div></section>
<section class="screen" id="favorites"><div class="head"><h1>Избранное</h1></div><div class="list" id="favoriteList"></div></section>
<nav class="nav"><button class="on" data-screen="map"><span>⌖</span>Карта</button><button data-screen="catalog"><span>☷</span>Каталог</button><button data-screen="requests"><span>◷</span>Заявки</button><button data-screen="favorites"><span>♡</span>Избранное</button></nav>
<div class="backdrop" id="detail"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="bookingModal"><div class="mbox"><div class="grab"></div><h2>Запросить бронь</h2><div class="sub" id="bookingName"></div><form class="form" id="bookingForm"><div class="field"><label>Дата</label><input id="date" type="date" required></div><div class="field"><label>Время</label><input id="time" type="time" value="19:00" required></div><div class="field"><label>Сколько часов</label><select id="hours"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>Гостей</label><input id="guests" type="number" min="1" max="30" value="6" required></div><div class="field full"><label>Телефон</label><input id="phone" type="tel" value="+7 900 000-00-00" required></div><div class="field full"><label>Комментарий</label><textarea id="comment" placeholder="Например: нужен бассейн, будем с детьми"></textarea></div><button class="submit">Отправить запрос</button></form></div></div>
<div class="toast" id="toast"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const venues=[
{id:1,name:'Берлога',type:'Русская баня',price:2400,rating:4.8,dist:'2,3 км',address:'Калининград, ул. Портовая, 18',lat:54.6966,lng:20.4938,cap:10,features:['Бассейн','На дровах','Караоке'],img:'https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?auto=format&fit=crop&w=900&q=80',desc:'Уютная русская баня с парной на дровах, бассейном и большой комнатой отдыха.'},
{id:2,name:'Старый Кёниг',type:'Банный комплекс',price:3200,rating:4.9,dist:'3,8 км',address:'Калининград, ул. А. Невского, 51',lat:54.7303,lng:20.5228,cap:14,features:['Бассейн','Бильярд','Мангал'],img:'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=900&q=80',desc:'Просторный банный комплекс для компании. Бассейн, бильярд, зона отдыха и мангал.'},
{id:3,name:'Балтийский пар',type:'Финская сауна',price:1900,rating:4.6,dist:'1,7 км',address:'Калининград, пр-т Мира, 72',lat:54.7117,lng:20.4753,cap:8,features:['Сауна','Джакузи','24/7'],img:'https://images.unsplash.com/photo-1583416750470-965b2707b355?auto=format&fit=crop&w=900&q=80',desc:'Компактная финская сауна с джакузи в центре города. Работает круглосуточно.'},
{id:4,name:'Amber SPA',type:'Сауна и хаммам',price:4200,rating:4.9,dist:'4,6 км',address:'Калининград, Московский пр-т, 186',lat:54.7048,lng:20.5507,cap:12,features:['Хаммам','Бассейн','Массаж'],img:'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=900&q=80',desc:'Премиальный формат: хаммам, бассейн, массаж и приватная зона отдыха.'},
{id:5,name:'Пар & Дым',type:'Русская баня',price:2700,rating:4.7,dist:'5,4 км',address:'Калининград, ул. Гагарина, 99',lat:54.7203,lng:20.5706,cap:10,features:['На дровах','Купель','Банщик'],img:'https://images.unsplash.com/photo-1530124566582-a618bc2615dc?auto=format&fit=crop&w=900&q=80',desc:'Классическая русская баня, купель и услуги банщика. Подходит для небольших компаний.'},
{id:6,name:'Зелёный чан',type:'Баня с чаном',price:3600,rating:4.9,dist:'8,9 км',address:'Малое Исаково, ул. Центральная, 8',lat:54.7578,lng:20.5943,cap:12,features:['Чан','На дровах','Мангал'],img:'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=900&q=80',desc:'Загородная баня на дровах с горячим чаном под открытым небом и мангальной зоной.'}
];
const filterNames=['Все','Бассейн','До 2500 ₽','Хаммам','На дровах','24/7'];let filter='Все',current=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const favs=new Set(JSON.parse(localStorage.getItem('pargid_favs')||'[]'));const requests=JSON.parse(localStorage.getItem('pargid_requests')||'[]');let map={flyTo(){},invalidateSize(){}};
if(window.L){map=L.map('map',{zoomControl:false}).setView([54.7104,20.4522],12.3);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);venues.forEach(v=>L.marker([v.lat,v.lng],{icon:L.divIcon({className:'',html:'<div class="marker">♨</div>',iconSize:[42,42],iconAnchor:[21,21]})}).addTo(map).on('click',()=>openVenue(v.id)))}
function filtered(){const q=$('#search').value.trim().toLowerCase();return venues.filter(v=>{const s=[v.name,v.type,v.address,...v.features].join(' ').toLowerCase();const f=filter==='Все'||filter==='Бассейн'&&v.features.includes('Бассейн')||filter==='До 2500 ₽'&&v.price<=2500||filter==='Хаммам'&&v.features.includes('Хаммам')||filter==='На дровах'&&v.features.includes('На дровах')||filter==='24/7'&&v.features.includes('24/7');return (!q||s.includes(q))&&f})}
function tags(v){return v.features.map(x=>`<span class="tag">${x}</span>`).join('')}function card(v){return `<article class="card" data-id="${v.id}"><img src="${v.img}"><div class="cb"><div class="ct"><b>${v.name}</b><span class="rate">★ ${v.rating}</span></div><div class="muted">${v.type} · ${v.dist}</div><div class="muted">${v.features.slice(0,2).join(' · ')}</div><div class="price">от ${v.price.toLocaleString('ru-RU')} ₽ <small>/ час</small></div></div></article>`}function item(v){return `<article class="item" data-id="${v.id}"><img src="${v.img}"><div class="body"><div class="ct"><b>${v.name}</b><span class="rate">★ ${v.rating}</span></div><div class="muted">${v.type} · ${v.dist}</div><div class="price">от ${v.price.toLocaleString('ru-RU')} ₽ <small>/ час</small></div><div class="tags">${v.features.slice(0,3).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></article>`}
function render(){const a=filtered();$('#chips').innerHTML=filterNames.map(x=>`<button class="chip ${x===filter?'on':''}" data-f="${x}">${x}</button>`).join('');$$('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});$('#cards').innerHTML=a.map(card).join('');$('#catalogList').innerHTML=a.map(item).join('')||'<div class="empty"><strong>⌕</strong>Ничего не найдено</div>';$('#count').textContent=a.length+' мест';$$('.card,.item').forEach(x=>x.onclick=()=>openVenue(+x.dataset.id));renderFavs();renderRequests()}
function renderFavs(){const a=venues.filter(v=>favs.has(v.id));$('#favoriteList').innerHTML=a.map(item).join('')||'<div class="empty"><strong>♡</strong>Здесь будут любимые места</div>';$$('#favoriteList .item').forEach(x=>x.onclick=()=>openVenue(+x.dataset.id))}
function renderRequests(){if(!requests.length){$('#requestList').innerHTML='<div class="empty"><strong>◷</strong>Заявок пока нет.<br>Выберите баню и запросите бронь.</div>';return}$('#requestList').innerHTML=requests.slice().reverse().map(b=>`<article class="booking"><span class="status">Ожидает ответа</span><h3>${b.venue}</h3><p>📅 ${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date(b.date+'T12:00:00'))} · ${b.time} · ${b.hours} ч.</p><p>👥 ${b.guests} гостей</p><p>☎ ${b.phone}</p></article>`).join('')}
function openVenue(id){const v=venues.find(x=>x.id===id);current=v;map.flyTo([v.lat,v.lng],13.5);$('#sheet').innerHTML=`<div class="hero"><img src="${v.img}"><button class="fav">${favs.has(v.id)?'♥':'♡'}</button><button class="close">×</button></div><div class="detail"><h2>${v.name}</h2><div class="muted">${v.address} · ${v.dist}</div><div class="facts"><div class="fact"><b>★ ${v.rating}</b><small>рейтинг</small></div><div class="fact"><b>до ${v.cap}</b><small>гостей</small></div><div class="fact"><b>${v.price.toLocaleString('ru-RU')} ₽</b><small>от / час</small></div></div><div class="section">Услуги</div><div class="tags">${tags(v)}</div><div class="section">О месте</div><div class="desc">${v.desc}</div><div class="actions"><button class="call">☎ Позвонить</button><button class="book">🔥 Запросить бронь</button><button class="route">⌖ Построить маршрут</button><button class="taxi">🚕 Заказать Яндекс Go</button></div></div>`;$('#detail').classList.add('on');$('.close').onclick=closeVenue;$('.fav').onclick=()=>{favs.has(v.id)?favs.delete(v.id):favs.add(v.id);localStorage.setItem('pargid_favs',JSON.stringify([...favs]));openVenue(v.id);renderFavs()};$('.call').onclick=()=>{toast('Открываем звонок администратору');location.href='tel:+74012999999'};$('.book').onclick=()=>openBooking(v);$('.route').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}`,'_blank');$('.taxi').onclick=()=>toast('В боевой версии откроется Яндекс Go с готовым маршрутом')}
function closeVenue(){$('#detail').classList.remove('on')}function openBooking(v){current=v;$('#bookingName').textContent=v.name+' · от '+v.price.toLocaleString('ru-RU')+' ₽/час';const d=new Date();d.setDate(d.getDate()+1);$('#date').value=d.toISOString().slice(0,10);$('#date').min=new Date().toISOString().slice(0,10);$('#bookingModal').classList.add('on')}
function show(name){const mapMode=name==='map';['catalog','requests','favorites'].forEach(x=>$('#'+x).classList.toggle('on',x===name));$('#map').style.display=mapMode?'block':'none';$('#mapTop').style.display=mapMode?'block':'none';$('#cards').style.display=mapMode?'flex':'none';$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.screen===name));if(mapMode)setTimeout(()=>map.invalidateSize(),40)}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('on'),2400)}
$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));$('#search').oninput=render;$('#profile').onclick=()=>toast('Профиль клиента — следующий этап');$('#detail').onclick=e=>{if(e.target.id==='detail')closeVenue()};$('#bookingModal').onclick=e=>{if(e.target.id==='bookingModal')$('#bookingModal').classList.remove('on')};$('#bookingForm').onsubmit=e=>{e.preventDefault();requests.push({venue:current.name,date:$('#date').value,time:$('#time').value,hours:$('#hours').value,guests:$('#guests').value,phone:$('#phone').value,comment:$('#comment').value});localStorage.setItem('pargid_requests',JSON.stringify(requests));$('#bookingModal').classList.remove('on');closeVenue();renderRequests();show('requests');toast('Заявка отправлена администратору')};render();
</script>
</body>
</html>
